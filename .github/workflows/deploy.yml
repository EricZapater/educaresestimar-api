name: Deploy Backend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ericzapater/educaresestimar-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/educaresestimar


            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull nova imatge
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Reiniciar només l'API
            docker compose stop educaresestimar-api
            docker compose rm -f educaresestimar-api
            docker compose up -d educaresestimar-api

            # Esperar a que la mateixa API intenti de bootar
            sleep 5
            
            STATUS=$(docker compose ps -q educaresestimar-api | xargs docker inspect -f '{{.State.Status}}')
            if [ "$STATUS" != "running" ]; then
              echo "Error: Container crashed during startup. Status: $STATUS"
              docker compose logs educaresestimar-api
              exit 1
            fi

            # Neteja imatges antigues
            docker image prune -f

            echo "✅ Backend desplegat!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/educaresestimar
            docker compose ps educaresestimar-api
            echo "🔗 API disponible a: https://api.educaresestimar.cat/docs"

      - name: 🚀 Registrar Desplegament a RawCraft Monitor
        if: always()
        run: |
          curl -fsSL -X POST https://api.monitor.ericzapater.cat/api/v1/deploys \
            -H "Content-Type: application/json" \
            -H "X-Agent-Key: ${{ secrets.RAWCRAFT_API_KEY }}" \
            -d '{
              "product_name": "educaresestimar-back",
              "environment": "production",
              "version": "${{ github.ref_name }}",
              "commit_sha": "${{ github.sha }}",
              "commit_message": '"$(echo "${{ github.event.head_commit.message }}" | jq -sR .)"',
              "branch": "${{ github.ref_name }}",
              "deployed_by": "${{ github.actor }}",
              "status": "${{ job.status == 'success' && 'SUCCESS' || 'FAILED' }}"
            }'
